name: Research Atlas checks
on:
  push:
    paths: ['research-atlas/**', '.github/workflows/research-atlas.yml']
  pull_request:
    paths: ['research-atlas/**', '.github/workflows/research-atlas.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research-atlas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: research-atlas/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Independently validate DOCX export
        run: |
          node --import tsx scripts/check-docx.ts
          python3 scripts/check-docx.py
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e -- --max-failures=8 --reporter=line
        if: ${{ !cancelled() }}
        env:
          ATLAS_FIREFOX: '1'
          ATLAS_WEBKIT: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-verification
          path: |
            research-atlas/test-results/
            research-atlas/docs/smoke/
            research-atlas/docx-verification.docx

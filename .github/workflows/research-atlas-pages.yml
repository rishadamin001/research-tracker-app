name: Publish Research Atlas to GitHub Pages
run-name: Publish Research Atlas at ${{ github.sha }}
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions: {}
concurrency:
  group: research-atlas-pages
  cancel-in-progress: false
jobs:
  verify:
    if: >-
      github.ref == 'refs/heads/main' && github.repository == 'rishadamin001/research-tracker-app' &&
      (github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Publish approved Research Atlas '))
    permissions:
      contents: read
    uses: ./.github/workflows/research-atlas.yml
    with:
      upload_pages: true

  deploy:
    if: >-
      github.ref == 'refs/heads/main' && github.repository == 'rishadamin001/research-tracker-app' &&
      (github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Publish approved Research Atlas '))
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the checked artifact
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment


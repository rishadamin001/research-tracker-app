name: Research Atlas live providers
on:
  workflow_dispatch:
  push:
    paths: ['research-atlas/**', '.github/workflows/research-atlas-providers.yml']
  pull_request:
    paths: ['research-atlas/**', '.github/workflows/research-atlas-providers.yml']
permissions:
  contents: read
jobs:
  check-providers:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research-atlas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: research-atlas/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Crossref preview and production diagnostics
        run: |
          node scripts/preview.mjs &
          ATLAS_PREVIEW_PID=$!
          trap 'kill "$ATLAS_PREVIEW_PID"' EXIT
          node scripts/crossref-diagnostics.mjs http://127.0.0.1:4173/ https://rishadamin001.github.io/research-tracker-app/
      - name: Live public literature sources
        run: node scripts/search-smoke.mjs http://127.0.0.1:4173/ --serve
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-provider-verification
          path: research-atlas/docs/smoke/


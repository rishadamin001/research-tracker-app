name: Verify published Research Atlas
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  published-smoke:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research-atlas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: research-atlas/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify published primary flow
        run: node scripts/smoke.mjs https://rishadamin001.github.io/research-tracker-app/ "$GITHUB_SHA"
      - name: Verify published literature providers
        run: node scripts/search-smoke.mjs https://rishadamin001.github.io/research-tracker-app/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-published-verification
          path: |
            research-atlas/docs/smoke/
            atlas-production-*.png

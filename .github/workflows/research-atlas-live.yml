name: Verify published Research Atlas
on:
  workflow_dispatch:
    inputs:
      deployed_sha:
        description: Expected deployed commit SHA (optional for legacy builds).
        type: string
        required: false
permissions:
  contents: read
jobs:
  published-smoke:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research-atlas
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: research-atlas/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify published primary flow
        env:
          ATLAS_EXPECTED_DEPLOYED_SHA: ${{ inputs.deployed_sha }}
        run: node scripts/smoke.mjs https://rishadamin001.github.io/research-tracker-app/ "$ATLAS_EXPECTED_DEPLOYED_SHA"
      - name: Verify published literature providers
        run: node scripts/search-smoke.mjs https://rishadamin001.github.io/research-tracker-app/
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: atlas-published-verification
          path: |
            research-atlas/docs/smoke/
            atlas-production-*.png
